<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>School Languages</title>
</head>
<body>
    <form action="">
        <h2>Inscreve-se</h2>
        <hr>
        <input type="text" id="nome"
        placeholder="nome..."
        ><br><br>
        <input type="text" id="morada"
        placeholder="morada..."><br><br>
        <label for="">Curso </label>
        <select name="" id="nome_Curso">
            <option value="English" id="en">English</option>
            <option value="Frances" id="fr">Frances</option>
            <option value="Espanhol" id="ep">Espanhol</option>
            <option value="Italiano" id="ita">Italiano</option>
            <option value="Mandarim" id="ma">Mandarim</option>
        </select><br><br>
        <button type="submit" onclick="">Inscrever</button>
    </form>
</body>
</html>
